<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MariclePlus-Map</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f3f6fb;
            --surface: #ffffff;
            --surface-strong: #f7f9fc;
            --text: #172033;
            --text-secondary: #667085;
            --line: #d9e1ee;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --shadow-color: rgba(15, 23, 42, 0.16);
            --focus-ring: rgba(37, 99, 235, 0.12);
            --overlay: rgba(0, 0, 0, 0.35);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --surface: #1f2937;
                --surface-strong: #273244;
                --text: #f3f4f6;
                --text-secondary: #cbd5e1;
                --line: #374151;
                --accent: #60a5fa;
                --accent-hover: #93c5fd;
                --danger: #f87171;
                --shadow-color: rgba(0, 0, 0, 0.42);
                --focus-ring: rgba(96, 165, 250, 0.20);
                --overlay: rgba(0, 0, 0, 0.55);
            }
        }

        :root[data-theme="dark"] {
            --bg: #111827;
            --surface: #1f2937;
            --surface-strong: #273244;
            --text: #f3f4f6;
            --text-secondary: #cbd5e1;
            --line: #374151;
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --danger: #f87171;
            --shadow-color: rgba(0, 0, 0, 0.42);
            --focus-ring: rgba(96, 165, 250, 0.20);
            --overlay: rgba(0, 0, 0, 0.55);
        }

        :root[data-theme="light"] {
            --bg: #f3f6fb;
            --surface: #ffffff;
            --surface-strong: #f7f9fc;
            --text: #172033;
            --text-secondary: #667085;
            --line: #d9e1ee;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --shadow-color: rgba(15, 23, 42, 0.16);
            --focus-ring: rgba(37, 99, 235, 0.12);
            --overlay: rgba(0, 0, 0, 0.35);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", sans-serif;
        }

        .app-window {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            min-width: 720px;
            min-height: 520px;
            background: var(--surface);
            border: none;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .window-header {
            height: 48px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            user-select: none;
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-controls button,
        .toolbar button,
        .modal-footer button {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .window-controls button:hover,
        .toolbar button:hover,
        .modal-footer button:hover {
            background: var(--surface-strong);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--surface-strong);
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .region-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .region-switcher label {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .region-btn {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }

        .region-btn:hover {
            background: var(--surface-strong);
        }

        .region-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .address-input-group {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 280px;
        }

        input,
        textarea,
        select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--focus-ring);
        }

        .address-input-group input {
            flex: 1;
        }

        .address-input-group button {
            background: var(--accent);
            color: var(--surface);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .address-input-group button:hover {
            background: var(--accent-hover);
        }

        .style-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-clear {
            color: var(--danger);
        }

        .window-body {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #map-container {
            width: 100%;
            height: 100%;
        }

        .resize-handle {
            position: absolute;
            z-index: 10;
        }

        .resize-handle-se {
            right: 0;
            bottom: 0;
            width: 18px;
            height: 18px;
            cursor: nwse-resize;
        }

        .resize-handle-e {
            right: 0;
            top: 48px;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
        }

        .resize-handle-s {
            left: 0;
            right: 0;
            bottom: 0;
            height: 8px;
            cursor: ns-resize;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal.hidden,
        .loading.hidden {
            display: none;
        }

        .modal-content {
            width: 420px;
            max-width: 92vw;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 22px 70px var(--shadow-color);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }

        .modal-header h3 {
            margin: 0;
        }

        .modal-close {
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
        }

        .modal-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 10px;
            align-items: start;
        }

        .detail-row label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .style-change-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            resize: vertical;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid var(--line);
        }

        .btn-danger {
            color: var(--danger);
        }

        .loading {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 9998;
            color: var(--text);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .amap-info-content {
            background: var(--surface) !important;
            color: var(--text) !important;
            border: 1px solid var(--line) !important;
            border-radius: 8px !important;
            padding: 8px 10px !important;
        }

        .hide-amap-logo .amap-logo,
        .hide-amap-logo .amap-copyright {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="app-window" class="app-window">
       

        <div class="toolbar">
            <div class="address-input-group">
                <input type="text" id="address-input" placeholder="输入地址（多个地址用逗号分隔）" />
                <button id="btn-add-markers" onclick="addMarkersByAddress()">标注</button>
            </div>
            <div class="style-selector">
                <label>标注样式：</label>
                <select id="marker-style">
                    <option value="red">红色圆点</option>
                    <option value="blue">蓝色圆点</option>
                    <option value="green">绿色圆点</option>
                    <option value="orange">橙色圆点</option>
                    <option value="purple">紫色圆点</option>
                    <option value="custom">自定义图片</option>
                </select>
                <input type="file" id="custom-icon-input" accept="image/*" onchange="handleCustomIcon(event)">
            </div>
            <div class="style-selector">
                <label>地图样式：</label>
                <select id="map-style" onchange="changeMapStyle()">
                    <option value="normal">标准</option>
                    <option value="dark">幻影黑</option>
                    <option value="light">月光银</option>
                    <option value="whitesmoke">远山黛</option>
                    <option value="fresh">草色青</option>
                    <option value="grey">雅士灰</option>
                    <option value="graffiti">涂鸦</option>
                    <option value="macaron">马卡龙</option>
                    <option value="blue">靛青蓝</option>
                    <option value="darkblue">极夜蓝</option>
                    <option value="wine">酱籽</option>
                </select>
            </div>
            <div class="region-switcher">
                <label>切换地区：</label>
                <button class="region-btn" data-region="beijing" onclick="switchRegion('beijing')">北京</button>
                <button class="region-btn" data-region="shanghai" onclick="switchRegion('shanghai')">上海</button>
                <button class="region-btn" data-region="shenzhen" onclick="switchRegion('shenzhen')">深圳</button>
            </div>
            <button class="btn-clear" onclick="clearAllMarkers()">清除全部</button>
            <button class="btn-fit" onclick="fitView()">适应视图</button>
            <button id="btn-toggle-logo" onclick="toggleMapLabels()">隐藏图例</button>
        </div>

        <div class="window-body" id="window-body">
            <div id="map-container"></div>
        </div>
    </div>

    <div id="marker-detail-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">标注详情</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <label>地址：</label>
                    <span id="detail-address">-</span>
                </div>
                <div class="detail-row">
                    <label>经度：</label>
                    <span id="detail-lng">-</span>
                </div>
                <div class="detail-row">
                    <label>纬度：</label>
                    <span id="detail-lat">-</span>
                </div>
                <div class="detail-row">
                    <label>备注：</label>
                    <textarea id="detail-note" placeholder="输入备注信息..."></textarea>
                </div>
                <div class="detail-row">
                    <label>样式：</label>
                    <div class="style-change-group">
                        <select id="detail-style">
                            <option value="red">红色圆点</option>
                            <option value="blue">蓝色圆点</option>
                            <option value="green">绿色圆点</option>
                            <option value="orange">橙色圆点</option>
                            <option value="purple">紫色圆点</option>
                            <option value="custom">自定义图片</option>
                        </select>
                        <input type="file" id="detail-custom-icon" accept="image/*" onchange="handleDetailCustomIcon(event)">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="applyStyleToMarker()">应用样式</button>
                <button onclick="saveNote()">保存备注</button>
                <button onclick="removeCurrentMarker()" class="btn-danger">删除标注</button>
            </div>
        </div>
    </div>

    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>正在解析地址...</span>
    </div>

    <script src="https://webapi.amap.com/maps?v=2.0&key=9f7f60b1af7923dcf5fa51ab37840e02&plugin=AMap.Scale,AMap.ToolBar"></script>
    <script>
        const AMAP_WS_KEY = '62c06a630b8af3efe9bf68f7e7730894';

        let map;
        let markers = [];
        let currentMarker = null;
        let customIconUrl = null;

        // 地区配置
        const REGIONS = {
            beijing: { name: '北京', center: [116.397428, 39.90923], zoom: 11 },
            shanghai: { name: '上海', center: [121.473701, 31.230416], zoom: 11 },
            shenzhen: { name: '深圳', center: [114.057868, 22.543099], zoom: 11 }
        };
        let currentRegion = 'beijing';

        function switchRegion(region) {
            if (!REGIONS[region]) return;
            currentRegion = region;
            const config = REGIONS[region];
            map.setZoomAndCenter(config.zoom, config.center, false, 600);

            // 更新按钮激活状态
            document.querySelectorAll('.region-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.region === region);
            });
        }

        const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        const styleMap = {
            red: createSvgIcon('#ef4444'),
            blue: createSvgIcon('#2563eb'),
            green: createSvgIcon('#22c55e'),
            orange: createSvgIcon('#f97316'),
            purple: createSvgIcon('#a855f7')
        };

        function initMap() {
            map = new AMap.Map('map-container', {
                zoom: 11,
                center: [116.397428, 39.90923],
                viewMode: '3D',
                resizeEnable: true,
                rotateEnable: true,
                pitchEnable: true
            });

            map.addControl(new AMap.Scale());
            map.addControl(new AMap.ToolBar());

            map.on('click', function (e) {
                addMarkerAtPosition(e.lnglat.getLng(), e.lnglat.getLat(), '手动标注点');
            });

            // 默认激活北京按钮
            document.querySelector('.region-btn[data-region="beijing"]').classList.add('active');
        }

        function createSvgIcon(color) {
            const surface = cssVar('--surface');
            const line = cssVar('--line');
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">
                    <circle cx="16" cy="16" r="11" fill="${color}" stroke="${surface}" stroke-width="2"/>
                    <circle cx="16" cy="16" r="4" fill="${surface}"/>
                    <path d="M16 30 C21 27 26 23 26 16 C26 7 21 2 16 2 C11 2 6 7 6 16 C6 23 11 27 16 30Z" fill="none" stroke="${color}" stroke-width="3"/>
                    <path d="M16 30 L16 38" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
                    <path d="M16 16 m-11 0 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0" fill="none" stroke="${line}" stroke-width="1.2"/>
                </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        async function addMarkersByAddress() {
            const input = document.getElementById('address-input').value.trim();
            if (!input) {
                alert('请输入至少一个地址');
                return;
            }

            const addresses = input.split(/[，,;；\n]/).map(item => item.trim()).filter(Boolean);
            showLoading(true);

            for (const address of addresses) {
                try {
                    const result = await geocodeAddress(address);
                    if (result.location) {
                        addMarkerAtPosition(result.location.lng, result.location.lat, address);
                    }
                } catch (error) {
                    console.error('地址解析失败:', address, error);
                    alert('地址解析失败：' + address);
                }
            }

            showLoading(false);
            fitView();
        }

        async function geocodeAddress(address) {
            const url = `https://restapi.amap.com/v3/geocode/geo?address=${encodeURIComponent(address)}&key=${AMAP_WS_KEY}&output=JSON`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('地理编码请求失败');
            const data = await response.json();
            if (data.geocodes && data.geocodes.length > 0) {
                const loc = data.geocodes[0].location.split(',');
                return {
                    success: true,
                    location: { lng: parseFloat(loc[0]), lat: parseFloat(loc[1]) },
                    address: address,
                    formatted_address: data.geocodes[0].formatted_address
                };
            }
            return { success: false, message: '未找到该地址对应的坐标' };
        }

        function addMarkerAtPosition(lng, lat, address) {
            const style = document.getElementById('marker-style').value;
            let icon;
            if (style === 'custom') {
                if (!customIconUrl) {
                    alert('请先上传自定义图片');
                    return;
                }
                icon = customIconUrl;
            } else {
                icon = styleMap[style];
            }

            const marker = new AMap.Marker({
                position: [lng, lat],
                icon: icon,
                title: address,
                offset: new AMap.Pixel(-16, -38),
                extData: {
                    address,
                    note: ''
                }
            });

            marker.on('click', function (e) {
                openMarkerDetail(e.target);
            });

            markers.push(marker);
            map.add(marker);

            // 如果是手动标注（无地址），自动调用逆地理编码获取地址
            if (address === '手动标注点') {
                reverseGeocode(lng, lat).then(function (addr) {
                    if (addr) {
                        const data = marker.getExtData();
                        data.address = addr;
                        marker.setExtData(data);
                        marker.setTitle(addr);
                    }
                });
            }
        }

        async function reverseGeocode(lng, lat) {
            try {
                const url = `https://restapi.amap.com/v3/geocode/regeo?location=${lng},${lat}&key=${AMAP_WS_KEY}&output=JSON`;
                const response = await fetch(url);
                if (!response.ok) return null;
                const data = await response.json();
                if (data.regeocode && data.regeocode.formatted_address) {
                    return data.regeocode.formatted_address;
                }
                return null;
            } catch (e) {
                console.error('逆地理编码失败:', e);
                return null;
            }
        }

        function openMarkerDetail(marker) {
            currentMarker = marker;
            const data = marker.getExtData();

            document.getElementById('detail-address').textContent = data.address || '地址解析中...';
            document.getElementById('detail-lng').textContent = marker.getPosition().getLng().toFixed(6);
            document.getElementById('detail-lat').textContent = marker.getPosition().getLat().toFixed(6);
            document.getElementById('detail-note').value = data.note || '';

            document.getElementById('marker-detail-modal').classList.remove('hidden');
        }

        function saveNote() {
            if (!currentMarker) return;
            const note = document.getElementById('detail-note').value.trim();
            const data = currentMarker.getExtData();
            data.note = note;
            currentMarker.setExtData(data);
            closeModal();
            alert('备注已保存');
        }

        let detailCustomIconUrl = null;

        function handleDetailCustomIcon(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    detailCustomIconUrl = buildCustomIconWithImage(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function applyStyleToMarker() {
            if (!currentMarker) return;
            const style = document.getElementById('detail-style').value;
            let icon;
            if (style === 'custom') {
                if (!detailCustomIconUrl) {
                    alert('请先上传自定义图片');
                    return;
                }
                icon = detailCustomIconUrl;
            } else {
                icon = styleMap[style];
            }
            currentMarker.setIcon(icon);
            closeModal();
        }

        function removeCurrentMarker() {
            if (!currentMarker) return;
            map.remove(currentMarker);
            markers = markers.filter(marker => marker !== currentMarker);
            currentMarker = null;
            closeModal();
        }

        function closeModal() {
            document.getElementById('marker-detail-modal').classList.add('hidden');
        }

        function fitView() {
            if (markers.length > 0) {
                map.setFitView(markers, false, [80, 80, 80, 80], 17);
            }
        }

        function clearAllMarkers() {
            map.remove(markers);
            markers = [];
            currentMarker = null;
        }

        function changeMapStyle() {
            const style = document.getElementById('map-style').value;
            map.setMapStyle('amap://styles/' + style);
        }

        let logoHidden = false;
        function toggleMapLabels() {
            logoHidden = !logoHidden;
            if (logoHidden) {
                // 隐藏地名文字 + POI图标 + 高德logo/版权
                map.setFeatures(['bg', 'road', 'building']);
                var container = document.getElementById('map-container');
                container.classList.add('hide-amap-logo');
            } else {
                // 恢复全部
                map.setFeatures(['bg', 'road', 'building', 'point']);
                var container = document.getElementById('map-container');
                container.classList.remove('hide-amap-logo');
            }
            document.getElementById('btn-toggle-logo').textContent = logoHidden ? '显示图例' : '隐藏图例';
        }

        function handleCustomIcon(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    customIconUrl = buildCustomIconWithImage(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        /**
         * 把用户上传的图片裁成圆形，嵌入定位图标的圆形区域内
         * 生成的图标尺寸与预设图标一致 (32x42)，图片圆形区域半径=11px
         */
        function buildCustomIconWithImage(img) {
            const W = 64, H = 84; // 2x for retina
            const cx = 32, cy = 32, r = 22; // 圆心和半径 (2x)
            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            // 1. 绘制圆形裁剪的图片
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            // 居中裁剪：取图片中心正方形区域
            const size = Math.min(img.width, img.height);
            const sx = (img.width - size) / 2;
            const sy = (img.height - size) / 2;
            ctx.drawImage(img, sx, sy, size, size, cx - r + 2, cy - r + 2, (r - 2) * 2, (r - 2) * 2);
            ctx.restore();

            // 2. 绘制圆形边框
            const accent = cssVar('--accent');
            const surface = cssVar('--surface');
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = accent;
            ctx.lineWidth = 3;
            ctx.stroke();

            // 3. 绘制底部尾巴（倒三角指针）
            ctx.beginPath();
            ctx.moveTo(cx - 8, cy + r - 4);
            ctx.lineTo(cx, cy + r + 20);
            ctx.lineTo(cx + 8, cy + r - 4);
            ctx.strokeStyle = accent;
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();

            // 4. 尾巴尖端小圆点
            ctx.beginPath();
            ctx.arc(cx, cy + r + 20, 3, 0, Math.PI * 2);
            ctx.fillStyle = accent;
            ctx.fill();

            return canvas.toDataURL('image/png');
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        initMap();
    </script>
</body>
