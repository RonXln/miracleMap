  --accent:#2563eb; --qiji:#1d4ed8; --key:#e4572e; --normal:#8a94a6; --normal-pin:rgba(90,100,116,.62); --normal-txt:#ffffff; --normal-line:rgba(255,255,255,.55);

*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC",sans-serif;
  overflow:hidden;
}
#app{position:relative;width:100vw;height:100vh;}
#map{width:100%;height:100%;}

/* 顶部标题条 */
#topbar{
  position:absolute;top:12px;left:12px;z-index:20;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--panel-bg);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;box-shadow:var(--shadow);max-width:calc(100vw - 340px);
}
#topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px;}
#topbar .sub{font-size:11px;color:var(--text-secondary);margin-top:1px;}
.city-tabs{display:flex;gap:6px;}
.city-tabs button{
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  padding:6px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-secondary);transition:.15s;
}
.city-tabs button:hover{background:var(--surface2);}
.city-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* 图例（自定义，替代高德原生） */
#legend{
  position:absolute;left:12px;bottom:16px;z-index:20;
  background:var(--panel-bg);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  box-shadow:var(--shadow);font-size:12px;line-height:1.9;max-width:230px;
}
#legend .lg-title{font-weight:700;margin-bottom:6px;font-size:12px;}
#legend .row{display:flex;align-items:center;gap:8px;color:var(--text-secondary);}
.dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
.dot.qiji{background:var(--qiji);border-radius:2px;transform:rotate(45deg);}
.star-ico{color:var(--qiji);font-size:15px;}
.dot.key{background:var(--key);}
.dot.normal{background:var(--normal);width:10px;height:10px;}
.tag-lg{width:22px;height:14px;border-radius:7px;flex:0 0 auto;display:inline-block;}
.tag-lg.key{background:var(--key);border:1px solid rgba(255,255,255,.6);}
.tag-lg.normal{background:var(--normal-pin);border:1px solid var(--normal-line);}
#legend .hint{margin-top:8px;font-size:11px;color:var(--text-secondary);border-top:1px dashed var(--line);padding-top:6px;}

/* 右侧信息面板 */
#panel{
  position:absolute;top:12px;right:12px;bottom:16px;z-index:20;width:310px;
  background:var(--panel-bg);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
}
#panel .ph{padding:12px 16px;border-bottom:1px solid var(--line);}
#panel .ph .pt{font-size:14px;font-weight:700;}
#panel .ph .pd{font-size:11px;color:var(--text-secondary);margin-top:2px;}
#panel .pbody{overflow-y:auto;padding:6px 0;flex:1;}
.card{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;}
.card:hover{background:var(--surface);}
.card.sel{background:var(--surface2);}
.card .cn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.badge{font-size:10px;padding:1px 7px;border-radius:20px;color:#fff;font-weight:600;flex:0 0 auto;}
.badge.qiji{background:var(--qiji);}
.badge.key{background:var(--key);}
.badge.normal{background:var(--normal);}
.tag{font-size:10px;color:var(--text-secondary);border:1px solid var(--line);padding:0 6px;border-radius:6px;}
.card .meta{font-size:11px;color:var(--text-secondary);margin-top:4px;line-height:1.55;}
.card .meta b{color:var(--text);font-weight:600;}
.stat{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:11px;color:var(--text-secondary);flex-wrap:wrap;}
.stat span b{color:var(--text);font-size:13px;}

.iw{font-family:inherit;max-width:280px;}
.iw .iw-h{font-size:14px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;color:#1a1d21;}
.iw .iw-row{font-size:12px;line-height:1.6;margin:3px 0;color:#3a4048;}
.iw .iw-row b{color:#1a1d21;}
.iw .iw-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;color:#fff;margin-right:4px;}

/* 地图上的常驻标签 marker */
.mk{transform:translate(-50%,-100%);cursor:pointer;white-space:nowrap;user-select:none;}
.mk .pin{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:16px;
  font-size:12px;font-weight:600;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.85);}
.mk.qiji .pin{background:var(--qiji);font-size:13px;}
.mk.key .pin{background:var(--key);}
.mk.normal .pin{background:var(--normal-pin);color:var(--normal-txt);backdrop-filter:blur(2px);

.mk.normal .ic{opacity:.8;}
.mk.normal .arrow{color:var(--normal-pin);}
.mk .ic{font-size:12px;line-height:1;}
.mk.qiji .ic{font-size:13px;}
.mk .arrow{position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:currentColor;}
.mk.key .arrow{color:var(--key);}
.mk.qiji .arrow{color:var(--qiji);}

@media (max-width:820px){

  #topbar{max-width:calc(100vw - 240px);}

let map, curCity='北京', markers=[], cards={}, curSel=null, infoWin=null;

// 灰色底图样式
const GRAY_STYLE='amap://styles/whitesmoke';

function catIcon(cat){
  return ({'园区':'▤','孵化器':'⬢','加速器':'▲','OPC':'◆','奇绩':'★'})[cat]||'⬢';
}
function levelClass(lv){ return lv===0?'qiji':(lv===1?'key':'normal'); }
function badgeText(r){ return r.level===0?'奇绩':(r.level===1?'重点':'普通'); }

AMapLoader.load({key:"9f7f60b1af7923dcf5fa51ab37840e02",version:"2.0",plugins:["AMap.InfoWindow","AMap.ToolBar","AMap.Scale"]})
.then((AMap)=>{
  map=new AMap.Map("map",{

function bindTabs(AMap){
  const tabs=document.querySelectorAll('#cityTabs button');
  tabs.forEach(b=>{
    b.classList.toggle('active', b.dataset.city===curCity);
    b.onclick=()=>{
      curCity=b.dataset.city;
      tabs.forEach(x=>x.classList.toggle('active',x.dataset.city===curCity));
      const v=CITY_VIEW[curCity];
      map.setZoomAndCenter(v.zoom, v.center);
      render(AMap, curCity);
    };
  });
}

function clearMarkers(){ markers.forEach(m=>map.remove(m)); markers=[]; cards={}; curSel=null; if(infoWin)infoWin.close(); }

function render(AMap, city){
  clearMarkers();
  const list=RAW.filter(r=>r.city===city);
  // 重点在上，普通在下，奇绩最上
  list.sort((a,b)=>a.level-b.level);
  list.forEach((r,idx)=>{
    r._id=city+'#'+idx;
    const lc=levelClass(r.level);
    const el=document.createElement('div');
    el.className='mk '+lc;
    {
      const ic = r.level===0?'★':catIcon(r.cat);
      const nm = r.level===2?shortName(r.name,8):shortName(r.name);
      el.innerHTML='<div class="pin"><span class="ic">'+ic+'</span>'+escapeHtml(nm)+'</div><span class="arrow"></span>';
    }
    const mk=new AMap.Marker({
      position:[r.lng,r.lat], content:el, anchor:'bottom-center',
      offset:new AMap.Pixel(0,0), zIndex: r.level===0?300:(r.level===1?200:100)
    });
    mk._el=el; mk._level=r.level;
    mk.on('click',()=>openDetail(r));
    map.add(mk); markers.push(mk);
  });
  buildPanel(city, list);
  // 首次渲染后错开重叠标牌，并绑定缩放/平移后重算
  setTimeout(()=>resolveOverlap(AMap), 60);
  if(!map._overlapBound){
    map._overlapBound=true;
    map.on('zoomend', ()=>setTimeout(()=>resolveOverlap(AMap),40));
    map.on('moveend', ()=>setTimeout(()=>resolveOverlap(AMap),40));
  }
}

// 标牌防重叠：按屏幕像素检测矩形碰撞，低优先级标牌垂直上移错开
function resolveOverlap(AMap){
  if(!markers.length) return;
  // 先全部复位
  markers.forEach(m=>m.setOffset(new AMap.Pixel(0,0)));
  // 优先级：奇绩(0)/重点(1) 先占位不动，普通(2) 让路；同级按当前顺序
  const items=markers.map(m=>{
    const el=m._el;
    const w=(el&&el.offsetWidth)||90, h=(el&&el.offsetHeight)||24;
    const px=map.lngLatToContainer(m.getPosition());
    return {m, level:m._level, w, h, cx:px.x, top:px.y - h, bottom:px.y};
  }).sort((a,b)=>a.level-b.level);
  const placed=[];
  const PAD=2;
  items.forEach(it=>{
    let dy=0, tries=0;
    // 生成候选矩形（bottom-center 锚点）
    const rectOf=(offY)=>({l:it.cx-it.w/2, r:it.cx+it.w/2, t:it.top+offY, b:it.bottom+offY});
    const hit=(A)=>placed.some(B=> !(A.r<B.l-PAD||A.l>B.r+PAD||A.b<B.t-PAD||A.t>B.b+PAD));
    let rect=rectOf(0);
    // 逐步向上抬升，直到不重叠或超过上限
    while(hit(rect) && tries<14){ dy-=(it.h+3); rect=rectOf(dy); tries++; }
    if(dy!==0) it.m.setOffset(new AMap.Pixel(0,dy));
    placed.push(rect);
  });
}

function shortName(n,max){
  max=max||10;
  n=n.replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'');
  n=n.split(/[\/／]/)[0];
  return n.length>max?n.slice(0,max)+'…':n;
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function detailHtml(r){
  const badgeCls=levelClass(r.level);
  let h='<div class="iw">';
  h+='<div class="iw-h">'+(r.level===0?'★ ':'')+escapeHtml(r.name)+'</div>';
  h+='<div style="margin-bottom:5px"><span class="iw-tag" style="background:'+tagColor(r.level)+'">'+badgeText(r)+'</span>';
  h+='<span class="iw-tag" style="background:#64748b">'+escapeHtml(r.cat)+'</span></div>';
  const rows=[['所在',r.area],['运营/背景',r.operator],['聚焦方向',r.focus],['规模/项目',r.scale],['定期活动',r.activity],['联系方式',r.contact],['与奇绩',r.coop&&r.coop!=='—'?r.coop:''],['接触状态',r.contacted&&!['本部'].includes(r.contacted)?r.contacted:'']];
  rows.forEach(([k,v])=>{ if(v&&v.trim()&&v!=='—') h+='<div class="iw-row"><b>'+k+'：</b>'+escapeHtml(v)+'</div>'; });
  if(r.website&&r.website.trim()){
    const u=escapeHtml(r.website.trim());
    const disp=r.website.trim().replace(/^https?:\/\//,'').replace(/\/$/,'');
    h+='<div class="iw-row"><b>官网：</b><a href="'+u+'" target="_blank" rel="noopener" style="color:#1d4ed8;text-decoration:underline;word-break:break-all">'+escapeHtml(disp)+'</a></div>';
  }
  h+='</div>';
  return h;
}
function tagColor(lv){ return lv===0?'#1d4ed8':(lv===1?'#e4572e':'#8a94a6'); }

function openDetail(r){
  infoWin.setContent(detailHtml(r));
  infoWin.open(map,[r.lng,r.lat]);
  map.panTo([r.lng,r.lat]);
  selectCard(r._id);
}

function buildPanel(city,list){
  document.getElementById('panelTitle').textContent=city;
  const key=list.filter(r=>r.level===1).length, qj=list.filter(r=>r.level===0).length, nm=list.filter(r=>r.level===2).length;
  document.getElementById('panelDesc').textContent='共 '+list.length+' 个物理载体';
  document.getElementById('panelStat').innerHTML=
    '<span><b>'+qj+'</b> 奇绩</span><span><b>'+key+'</b> 重点</span><span><b>'+nm+'</b> 普通</span>';
  const body=document.getElementById('panelBody'); body.innerHTML=''; cards={};
  list.forEach(r=>{
    const d=document.createElement('div'); d.className='card'; d.dataset.id=r._id;
    const bc=levelClass(r.level);
    let meta=[];
    if(r.focus) meta.push('<b>方向</b> '+escapeHtml(trunc(r.focus,40)));
    else if(r.scale) meta.push('<b>规模</b> '+escapeHtml(trunc(r.scale,40)));
    if(r.area) meta.push('<b>地址</b> '+escapeHtml(trunc(r.area,26)));
    d.innerHTML='<div class="cn">'+(r.level===0?'★ ':'')+escapeHtml(r.name)+
      '<span class="badge '+bc+'">'+badgeText(r)+'</span>'+
      '<span class="tag">'+escapeHtml(r.cat)+'</span></div>'+
      (meta.length?'<div class="meta">'+meta.join('<br>')+'</div>':'')+
      (r.website&&r.website.trim()?'<div class="meta"><a href="'+escapeHtml(r.website.trim())+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:#1d4ed8;text-decoration:none">🔗 官网</a></div>':'');
    d.onclick=()=>openDetail(r);
    body.appendChild(d); cards[r._id]=d;
  });
}
function trunc(s,n){s=s||'';return s.length>n?s.slice(0,n)+'…':s;}
function selectCard(id){
  if(curSel&&cards[curSel])cards[curSel].classList.remove('sel');
  curSel=id;
  const c=cards[id]; if(c){c.classList.add('sel'); c.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
</script>
